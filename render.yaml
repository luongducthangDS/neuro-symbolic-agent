services:
  - type: web
    name: neuro-symbolic-agent
    runtime: docker
    repo: https://github.com/luongducthangDS/neuro-symbolic-agent
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health
    autoDeploy: true
